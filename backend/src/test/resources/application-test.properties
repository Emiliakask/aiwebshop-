# Tests run against an in-memory database with dummy credentials: no Postgres or .env needed.
spring.datasource.url=jdbc:h2:mem:webshop;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
app.frontend-url=http://localhost:5173
spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret
app.admin.emails=admin@example.com
