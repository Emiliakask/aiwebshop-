spring.application.name=backend
server.port=3000

# Secrets and local settings come from backend/.env (never committed). See .env.example.
spring.config.import=optional:file:.env[.properties]

# Where the React app runs. Used for CORS (frontend sends cookies, so no wildcard) and login redirects.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/webshop}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
# Creates/updates tables from the entities. Fine for now; switch to migrations (Flyway) later.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Error responses include { message }. The frontend's apiClient reads it.
spring.web.error.include-message=always

# Money is integer cents: reject 12.99 for an integer field instead of silently truncating it to 12.
spring.jackson.deserialization.accept-float-as-int=false

# Session cookie (admin login + guest cart). Set COOKIE_SECURE=true in production (HTTPS).
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}

# Admin login with Google. Only these emails (comma-separated) get the admin role.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
app.admin.emails=${ADMIN_EMAILS:}

# Delivery to parcel machines (docs/shipping.md). Carriers shown at checkout, in this order.
app.shipping.enabled=omniva
# Delivery is free when the cart subtotal is at least this many euro cents (€50.00).
app.shipping.free-from-cents=5000
app.shipping.omniva.price-cents=499
app.shipping.omniva.locations-url=https://www.omniva.ee/locations.json
# How long the downloaded parcel machine list is reused before downloading it again.
app.shipping.omniva.refresh=12h

# Customer login with Smart-ID, directly to SK (docs/auth.md). demo | production; they never mix.
app.smartid.environment=${SMARTID_ENV:demo}
# Optional override; by default the SK URL of the chosen environment.
app.smartid.host-url=${SMARTID_HOST_URL:}
# From the SK contract. Empty in demo means SK's public demo relying party.
app.smartid.rp-uuid=${SMARTID_RP_UUID:}
app.smartid.rp-name=${SMARTID_RP_NAME:}
# Demo-only "Log in as test user". The app refuses to start with this on in production.
app.smartid.test-account-enabled=${SMARTID_TEST_ACCOUNT:false}
# OCSP check of the user's certificate. Must stay on in production.
app.smartid.check-revocation=true
# Shown in the Smart-ID app (max 200 characters). The verification-code test fixture signs this exact text.
app.smartid.display-text=Log in to Webshop
